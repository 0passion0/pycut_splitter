[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pycut-image-splitter"
version = "1.3.0"
description = "Memory-safe, ultra-fast pure Python + OpenCV + vectorized NumPy image layout parser and batch slicer."
requires-python = ">=3.12"
license = "Apache-2.0 OR MIT"
authors = [{ name = "0passion0" }, { name = "PyCut Contributors" }]
dependencies = [
  "numpy>=2.0",
  "opencv-python-headless>=4.10",
  "pillow>=10.0",
]

[project.scripts]
pycut-split = "pycut_splitter.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pycut_splitter*"]
